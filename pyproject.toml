[project]
name = "contractor-vetting-agent"
version = "0.1.0"
description = "Multi-Agent Contractor Vetting Platform using Google ADK"
authors = [
    {name = "Antigravity", email = "antigravity@google.com"},
]
dependencies = [
    "google-adk>=1.15.0,<2.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.150.0",
    "protobuf>=6.31.1,<7.0.0",
    "faker>=19.0.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
